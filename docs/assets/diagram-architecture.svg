<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aio-architecture-title aio-architecture-desc">
      <title id="aio-architecture-title">Auto Image Organizer architecture</title>
      <desc id="aio-architecture-desc">The browser UI talks to a FastAPI service in one Docker container. Its sort pipeline scans your folders, analyzes photos with local CLIP and MediaPipe models backed by a SQLite cache, optionally asks OpenAI to name groups, and hands a plan to an apply-and-undo step that moves files in the mounted library.</desc>
