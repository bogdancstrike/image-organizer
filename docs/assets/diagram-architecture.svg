      <text x="580" y="208" fill="#d4d4d8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scan → analyze → quality</text>
      <text x="580" y="224" fill="#d4d4d8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dedupe → categorize → plan</text>
      <text x="580" y="248" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thread pool · photos first</text>

